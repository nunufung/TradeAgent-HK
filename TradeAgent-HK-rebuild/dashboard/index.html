<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TradeAgent-HK</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f8fb;color:#152238}
    main{max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .card{background:white;border:1px solid #dfe5ee;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0000000d}
    h1{margin-bottom:4px}.muted{color:#64748b}.good{color:#087a55}.bad{color:#b42318}.wait{color:#a15c00}
    table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid #edf0f4;font-size:14px}
    #status{font-weight:700}
  </style>
</head>
<body><main>
  <h1>TradeAgent-HK v5</h1><p class="muted">Rule-first HK stock & options intelligence</p>
  <div class="grid">
    <section class="card"><h2>10:00 HKT Action</h2><div id="status">Loading…</div><div id="option"></div></section>
    <section class="card"><h2>Data discipline</h2><p>No synthetic option quote fallback. Missing Delta, liquidity, spread or margin evidence results in WAIT / NO TRADE.</p></section>
  </div>
  <section class="card" style="margin-top:16px"><h2>Stock ranking</h2><table><thead><tr><th>Symbol</th><th>Score</th><th>Trend</th><th>Spot</th><th>RSI</th></tr></thead><tbody id="stocks"></tbody></table></section>
</main>
<script>
(async()=>{try{
 const r=await fetch('../reports/latest_actionable.json',{cache:'no-store'}); if(!r.ok) throw new Error('No 10:00 report yet'); const d=await r.json();
 const o=d.option; document.getElementById('status').textContent=o?`${o.action}: ${o.symbol}`:'OPTION: NO TRADE';
 document.getElementById('status').className=o&&o.action==='DO'?'good':'wait';
 document.getElementById('option').innerHTML=o?`<p>Short ${o.type} ${o.strike} · ${o.expiry} · DTE ${o.dte}</p><p>Delta ${o.delta ?? 'n/a'} · Spread ${o.spread_pct==null?'n/a':(o.spread_pct*100).toFixed(1)+'%'}</p>`:'<p>No verified option passed all rules.</p>';
 document.getElementById('stocks').innerHTML=d.stocks.map(s=>`<tr><td>${s.symbol}</td><td>${s.score.toFixed(2)}</td><td>${s.trend}</td><td>${s.spot.toFixed(2)}</td><td>${s.rsi14.toFixed(1)}</td></tr>`).join('');
}catch(e){document.getElementById('status').textContent=e.message; document.getElementById('status').className='bad';}})();
</script></body></html>

name: HK Daily Reports

on:
  schedule:
    # GitHub cron is UTC. 23:00 UTC = 07:00 HKT next day.
    - cron: '0 23 * * *'
    # 02:00 UTC = 10:00 HKT.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Report mode
        required: true
        default: actionable
        type: choice
        options:
          - premarket
          - actionable

permissions:
  contents: write

concurrency:
  group: hk-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ENABLE_TRADINGAGENTS: ${{ vars.ENABLE_TRADINGAGENTS || '0' }}
      OPTIONS_CSV_URL: ${{ secrets.OPTIONS_CSV_URL }}
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
      WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
      WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
      WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE || 'en_US' }}
      WHATSAPP_MESSAGE_MODE: ${{ vars.WHATSAPP_MESSAGE_MODE || 'template' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${ENABLE_TRADINGAGENTS}" = "1" ] && [ -f tradingagents/requirements.txt ]; then
            pip install -r tradingagents/requirements.txt
          fi

      - name: Run tests
        run: pytest -q

      - name: Choose mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then
            MODE="premarket"
          else
            MODE="actionable"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Generate report
        run: python -u main.py --mode "${{ steps.mode.outputs.mode }}" --options-csv data/options.csv --report-dir reports

      - name: Send WhatsApp alert
        if: ${{ vars.WHATSAPP_ENABLED == '1' }}
        run: python -m tradeagent.integrations.whatsapp "reports/latest_${{ steps.mode.outputs.mode }}.json"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: reports/

      - name: Publish latest report to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest_${{ steps.mode.outputs.mode }}.md reports/latest_${{ steps.mode.outputs.mode }}.json
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "report: update ${{ steps.mode.outputs.mode }} HK market report"
            git push
          fi

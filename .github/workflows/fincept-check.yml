name: Fincept Analytics Check

on:
  pull_request:
  push:
    branches: [main, 'codex/fincept-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        run: |
          python -m pip install reportlab pypdf ta==0.11.0 'scipy>=1.11,<2'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-dejavu-core
      - name: Check pinned upstream and run complete local suite
        run: |
          python -c 'from fincept_bridge import verify_vendor; verify_vendor()'
          python -m unittest discover -s tests -v

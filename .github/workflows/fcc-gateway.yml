name: Build and deploy FCC gateway
on:
  pull_request:
    paths: ['gateway/**', 'tests/test_fcc_gateway.py', '.github/workflows/fcc-gateway.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to the separate FCC Docker Space after build passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fcc-gateway
  cancel-in-progress: false
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authenticated gateway edge
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10'
          python -m pytest tests/test_fcc_gateway.py -q
      - name: Build pinned FCC runtime
        run: docker build --pull -t tradeagent-fcc gateway/space
      - name: Publish to eligible Hugging Face account
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FCC_ALLOWED_MODELS: ${{ vars.FCC_ALLOWED_MODELS }}
        run: |
          python -m pip install 'huggingface_hub>=0.34,<2'
          python gateway/publish.py

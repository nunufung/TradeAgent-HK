name: Telegram Stock PDF Request

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Explicit HK stock code; blank processes a pending Telegram request'
        type: string
        default: ''
  workflow_call:
    inputs:
      ticker:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: telegram-stock-request
  cancel-in-progress: false

jobs:
  request:
    # Extra stock research now requires an explicit manual invocation.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_BASE: https://api.deepseek.com/v1
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize report dependencies only (FinRL trains separately)
        run: git submodule update --init --recursive tradingagents tools/book-to-skill

      - name: Check Telegram for an authorized ticker
        id: poll
        env:
          DIRECT_TICKER: ${{ inputs.ticker }}
        run: python telegram_stock_bot.py prepare

      - name: Reply to help or invalid ticker
        if: steps.poll.outputs.kind == 'help' || steps.poll.outputs.kind == 'invalid'
        env:
          REQUEST_KIND: ${{ steps.poll.outputs.kind }}
          REQUEST_TICKER: ${{ steps.poll.outputs.ticker }}
        run: python telegram_stock_bot.py reply

      - name: Acknowledge help or invalid message
        if: steps.poll.outputs.kind == 'help' || steps.poll.outputs.kind == 'invalid'
        env:
          REQUEST_UPDATE_ID: ${{ steps.poll.outputs.update_id }}
        run: python telegram_stock_bot.py ack

      - name: Confirm analysis request
        if: steps.poll.outputs.kind == 'stock'
        env:
          REQUEST_KIND: stock
          REQUEST_TICKER: ${{ steps.poll.outputs.ticker }}
        run: python telegram_stock_bot.py reply

      - name: Set up Python for report
        if: steps.poll.outputs.kind == 'stock'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install report dependencies
        if: steps.poll.outputs.kind == 'stock'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./tradingagents

      - name: Install embedded PDF fonts
        if: steps.poll.outputs.kind == 'stock'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-dejavu-core

      - name: Run TradingAgents for requested stock
        if: steps.poll.outputs.kind == 'stock'
        env:
          REQUEST_TICKER: ${{ steps.poll.outputs.ticker }}
        run: python -u hk_adapter.py "$REQUEST_TICKER"

      - name: Generate requested PDF
        if: steps.poll.outputs.kind == 'stock'
        run: |
          mkdir -p pdf_reports
          python generate_pdf.py --output-dir pdf_reports

      - name: Send PDF to the requesting Telegram chat
        id: send_pdf
        if: steps.poll.outputs.kind == 'stock'
        env:
          REQUEST_TICKER: ${{ steps.poll.outputs.ticker }}
        run: python telegram_stock_bot.py send-pdf

      - name: Report analysis failure to Telegram
        if: failure() && steps.poll.outputs.kind == 'stock'
        env:
          REQUEST_TICKER: ${{ steps.poll.outputs.ticker }}
        run: python telegram_stock_bot.py notify-failure
        continue-on-error: true

      - name: Acknowledge handled Telegram update
        if: always() && steps.poll.outputs.update_id != ''
        env:
          REQUEST_UPDATE_ID: ${{ steps.poll.outputs.update_id }}
        run: python telegram_stock_bot.py ack

      - name: Save stock delivery receipt and research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-stock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stock_delivery_receipt.json
            final_summary.txt
            stock_analysis.md
            stock_signals.json
            report_*.md
            pdf_reports/*.pdf
          if-no-files-found: warn
          retention-days: 7

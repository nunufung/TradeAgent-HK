name: Kronos Bluechip Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kronos-bluechip-backtest.yml'
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      tickers: ${{ steps.scope.outputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - id: scope
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('market_watchlist.json'))
          codes=[x['code'] for x in d['stocks'] if x['group']=='bluechip']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('tickers='+json.dumps(codes)+'\n')
          PY
  forecast:
    needs: scope
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        ticker: ${{ fromJson(needs.scope.outputs.tickers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reviewed CPU environment
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-kronos.txt
          git clone https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          git -C /tmp/Kronos checkout --detach 67b630e67f6a18c9e9be918d9b4337c960db1e9a
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-base-v1
      - name: Audit fixed parameters without tuning
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python kronos_backtest.py --source /tmp/Kronos --tickers '${{ matrix.ticker }}' --output audit/${{ matrix.ticker }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kronos-bluechip-${{ matrix.ticker }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [scope, forecast]
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kronos-bluechip-*
          path: audit-inputs
      - name: Combine complete and failed stocks
        run: python kronos_bluechip_report.py --inputs audit-inputs --output research/kronos-bluechips-2026-10-25
      - uses: actions/upload-artifact@v4
        with:
          name: kronos-bluechip-summary
          path: research/kronos-bluechips-2026-10-25/
          retention-days: 30
      - name: Save reviewable results in repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'research/kronos-bluechips-2026-10-25';
            const head = (await github.rest.git.getRef({...context.repo, ref:'heads/main'})).data.object.sha;
            const base = (await github.rest.git.getCommit({...context.repo, commit_sha:head})).data.tree.sha;
            const tree = (await github.rest.git.createTree({...context.repo,base_tree:base,tree:fs.readdirSync(dir).map(name => ({path:dir+'/'+name,mode:'100644',type:'blob',content:fs.readFileSync(dir+'/'+name,'utf8')}))})).data.sha;
            const commit = (await github.rest.git.createCommit({...context.repo,message:'Save fixed-parameter Kronos bluechip audit results',tree,parents:[head]})).data.sha;
            await github.rest.git.updateRef({...context.repo,ref:'heads/main',sha:commit,force:false});

name: Free Tech AI News Check

on:
  push:
    branches: [main]
    paths:
      - 'free_tech_news.py'
      - 'hk_adapter.py'
      - 'linked_stock_analysis.py'
      - 'generate_pdf.py'
      - 'hk_market_briefing.py'
      - 'market_watchlist.json'
      - 'market_recommendations.py'
      - 'final_summary.py'
      - 'tests/test_final_summary.py'
      - '.github/workflows/futu-options.yml'
      - 'main.py'
      - 'agents/screening_agent.py'
      - 'scripts/run-linked-options.py'
      - 'scripts/send-option-report.py'
      - 'tests/test_recommendations.py'
      - 'tests/test_option_screen.py'
      - 'scripts/run-report.sh'
      - '.github/workflows/hk-daily.yml'
      - 'tests/test_market_briefing.py'
      - 'tests/test_free_tech_news.py'
      - 'tests/test_news_pdf.py'
      - '.github/workflows/free-news-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF test dependencies and Chinese fonts
        run: |
          python -m pip install reportlab pypdf
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei fonts-dejavu-core
      - name: Test news integration, existing gates and Chinese PDF
        run: |
          python -m py_compile free_tech_news.py hk_market_briefing.py hk_adapter.py linked_stock_analysis.py generate_pdf.py market_recommendations.py main.py scripts/run-linked-options.py scripts/send-option-report.py final_summary.py
          bash -n scripts/run-report.sh
          python -m unittest discover -s tests -v
      - name: Check live free sources without API keys
        run: |
          python free_tech_news.py --output free_news_preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path('free_news_preview.json').read_text())
          if not any(source['status'] == 'ok' for source in batch['sources']):
              raise SystemExit('All free RSS sources are unavailable.')
          print(f"Collected {len(batch['articles'])} dated technology/AI candidates.")
          PY
      - name: Check blue-chip and technology market sources without API keys
        run: |
          python hk_market_briefing.py --collect-only --output market_news_preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path('market_news_preview.json').read_text())
          if not batch['candidates']:
              raise SystemExit('No dated market news candidates available.')
          print(f"Collected {len(batch['candidates'])} cross-stock market news candidates.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-tech-ai-news-check
          path: |
            free_news_preview.json
            market_news_preview.json
          if-no-files-found: warn
          retention-days: 3

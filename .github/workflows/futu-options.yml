name: Futu HK Option Screen

on:
  schedule:
    # 10:10 HKT, Monday to Friday. GitHub cron is UTC.
    - cron: '10 2 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma-separated HK stock codes, e.g. 700,2800'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: futu-option-screen
  cancel-in-progress: false

jobs:
  screen:
    # Must run on the Mac where OpenD is signed in and listening on localhost.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    env:
      FUTU_OPEND_HOST: 127.0.0.1
      FUTU_OPEND_PORT: 11111
      FUTU_SECURITY_FIRM: FUTUSECURITIES
      FUTU_TRD_ENV: REAL
      FUTU_ACC_ID: ${{ secrets.FUTU_ACC_ID }}
      FUTU_ACC_INDEX: ${{ vars.FUTU_ACC_INDEX || '0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAHK_CJK_FONT: ${{ vars.TAHK_CJK_FONT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use installed Mac Python in an isolated environment
        env:
          TAHK_MAC_PYTHON: ${{ vars.TAHK_MAC_PYTHON }}
          TAHK_PYTHON_MIN_MINOR: '11'
        run: bash scripts/setup-mac-python.sh

      - name: Install TradingAgents and screen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./tradingagents

      - name: Locate today's completed cloud stock research
        id: research
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'hk-daily.yml', branch: context.payload.repository.default_branch,
              status: 'completed', per_page: 30
            });
            for (const run of data.workflow_runs.filter(r => r.conclusion === 'success')) {
              const runDay = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit'
              }).format(new Date(run.created_at));
              if (runDay !== day) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              if (artifacts.some(a => a.name === 'hk-reports' && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.info('No completed same-day cloud artifact: Mac will build fresh research.');

      - name: Download cloud research
        if: steps.research.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hk-reports
          run-id: ${{ steps.research.outputs.run_id }}
          github-token: ${{ github.token }}
          path: market_cache

      - name: Run linked four-analyst recommendations and real Futu scan
        env:
          TICKERS_INPUT: ${{ inputs.tickers }}
        run: |
          rm -rf option_pdf
          python scripts/run-linked-options.py

      - name: Send recommendation PDF or text to Telegram
        if: success() && hashFiles('recommendations.md') != '' && hashFiles('recommendations.json') != ''
        run: python scripts/send-option-report.py

      - name: Save report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futu-option-screen-${{ github.run_number }}
          path: |
            option_screen.md
            option_screen.json
            recommendations.md
            recommendations.json
            option_pdf/*.pdf
            report_market.md
            news_market.md
            market_briefing.json
            market_candidates.json
            stock_analysis.md
            stock_signals.json
            news_*.md
            free_news_*.json
          if-no-files-found: warn
          retention-days: 14

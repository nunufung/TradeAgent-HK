name: daily-hk-scan
on:
  schedule:
    - cron: '0 23 * * *'  # 07:00 HKT
    - cron: '0 2 * * *'   # 10:00 HKT
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python data_agent.py

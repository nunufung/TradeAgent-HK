- run: pip install requests beautifulsoup4 lxml

name: scan
on: 
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Run
        run: python main.py
        env:
          FUTU_PWD: ${{ secrets.FUTU_PWD }}
          FUTU_ID: ${{ secrets.FUTU_ID }}

name: HK Daily Report

on:
  schedule:
    - cron: '0 22 * * *'  # 06:00 HKT: budgeted research
    - cron: '15 0 * * *'  # 08:15 HKT: one concise message
    - cron: '35 0 * * *'  # 08:35 HKT: backup if delivery has not been claimed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hk-daily-${{ github.event.schedule == '0 22 * * *' && 'research' || github.event_name == 'workflow_dispatch' && 'research' || 'delivery' }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
    steps:
      - name: Inspect today's saved research and budget
        id: morning
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
            core.setOutput('date', day);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            const current = artifacts.filter(a => !a.expired && a.name.startsWith('hk-morning-' + day + '-')).sort((a,b) => b.id-a.id);
            const claimed = artifacts.some(a => !a.expired && a.name === 'hk-daily-research-claim-' + day);
            core.setOutput('skip', current.length || claimed ? 'true' : 'false');
            const ledger = artifacts.filter(a => !a.expired && a.name.startsWith('hk-token-budget-' + day + '-')).sort((a,b) => b.id-a.id)[0];
            if (ledger) {
              core.setOutput('ledger_name', ledger.name);
              core.setOutput('ledger_run', String(ledger.workflow_run.id));
            }
      - uses: actions/checkout@v4
        if: steps.morning.outputs.skip != 'true'
        with:
          submodules: recursive
      - name: Restore today's already charged API calls
        if: steps.morning.outputs.skip != 'true' && steps.morning.outputs.ledger_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.morning.outputs.ledger_name }}
          run-id: ${{ steps.morning.outputs.ledger_run }}
          github-token: ${{ github.token }}
          path: .
      - name: Reserve the day's only paid research session
        if: steps.morning.outputs.skip != 'true'
        run: echo '${{ github.run_id }}:${{ github.run_attempt }}' > research_claim.txt
      - name: Persist the research claim before any paid API calls
        if: steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-daily-research-claim-${{ steps.morning.outputs.date }}
          path: research_claim.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        if: steps.morning.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: steps.morning.outputs.skip != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ./tradingagents
      - name: Run bounded daily research
        if: steps.morning.outputs.skip != 'true'
        run: python daily_runner.py
      - name: Prepare a safe concise fallback if research failed
        if: always() && steps.morning.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from daily_budget import Budget, HKT
          from daily_delivery import fallback_summary
          Budget(Path('daily_token_usage.json'), datetime.now(HKT).date().isoformat())
          if not Path('final_summary.txt').is_file():
              Path('final_summary.txt').write_text(fallback_summary())
          PY
      - name: Save the daily API ledger before other artifacts
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-token-budget-${{ steps.morning.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: daily_token_usage.json
          if-no-files-found: error
          retention-days: 30
      - name: Save one concise morning report
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-morning-${{ steps.morning.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final_summary.txt
            daily_research_status.txt
          if-no-files-found: error
          retention-days: 3
      - name: Save market research for the Mac option update
        if: success() && steps.morning.outputs.skip != 'true' && hashFiles('market_briefing.json', 'stock_signals.json') != '' && hashFiles('report_market.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hk-market-research-${{ steps.morning.outputs.date }}
          overwrite: true
          path: |
            market_briefing.json
            market_candidates.json
            report_market.md
            news_market.md
            stock_signals.json
            stock_analysis.md
          retention-days: 3
      - name: Save research audit without sending another report
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report_*.md
            news_*.md
            free_news_*.json
            market_candidates.json
            market_briefing.json
            stock_signals.json
            stock_analysis.md
            recommendations.*
            final_summary.txt
            daily_token_usage.json
            run_*.log
          if-no-files-found: warn

  send_morning:
    if: github.event_name == 'schedule' && github.event.schedule != '0 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deadline, daily delivery claim and current report
        id: locate
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const day = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit'}).format(now);
            const clock = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Hong_Kong', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(now);
            const claim = 'hk-daily-delivery-claim-' + day;
            core.setOutput('date',day);
            core.setOutput('claim',claim);
            if (clock >= '08:59' || !process.env.TELEGRAM_BOT_TOKEN || !process.env.TELEGRAM_CHAT_ID) {
              core.setOutput('skip','true');
              core.warning('Too late for morning delivery, or delivery credentials missing.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            if (artifacts.some(a => a.name === claim && !a.expired)) {
              core.setOutput('skip','true');
              return;
            }
            core.setOutput('skip','false');
            const report = artifacts.filter(a => !a.expired && a.name.startsWith('hk-morning-' + day + '-')).sort((a,b) => b.id-a.id)[0];
            if (report) {
              core.setOutput('name', report.name);
              core.setOutput('run_id', String(report.workflow_run.id));
            }
      - name: Download today's concise report
        if: steps.locate.outputs.skip == 'false' && steps.locate.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: morning_report
      - name: Prepare durable delivery claim
        if: steps.locate.outputs.skip == 'false'
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from pathlib import Path
          from daily_delivery import HKT
          now = datetime.now(HKT)
          if now.time() >= time(8, 59):
              raise SystemExit('Delivery deadline reached.')
          Path('delivery_claim.txt').write_text(now.isoformat())
          PY
      - name: Claim the day's single send attempt before contacting Telegram
        if: steps.locate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.claim }}
          path: delivery_claim.txt
          if-no-files-found: error
          retention-days: 7
      - name: Send one current-day concise message
        if: steps.locate.outputs.skip == 'false'
        env:
          DAILY_DELIVERY_CLAIMED: 'true'
        run: python daily_delivery.py
      - name: Save confirmed delivery receipt
        if: success() && steps.locate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: hk-daily-delivery-receipt-${{ steps.locate.outputs.date }}
          path: delivery_receipt.json
          if-no-files-found: error
          retention-days: 30

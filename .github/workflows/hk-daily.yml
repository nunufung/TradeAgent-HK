name: HK Daily Report

on:
  schedule:
    - cron: '0 2 * * *'   # 10:00 HKT: start analysis after the market opens
    - cron: '10 2 * * *'  # 10:10 HKT: research backup; existing claim prevents duplicate API sessions
    - cron: '20 2 * * *'  # 10:20 HKT: research backup
    - cron: '47 2 * * *'  # 10:47 HKT: send completed research if available
    - cron: '53 2 * * *'  # 10:53 HKT: final backup; delayed sessions may continue
  push:
    branches: [main]
    paths: ['.github/daily-run-request.json']
  workflow_dispatch:
    inputs:
      ticker:
        description: 'HK stock code (blank = daily research)'
        type: string
        default: ''
      request_source:
        description: 'Caller label; compatible with the existing Telegram bridge'
        type: string
        default: manual
      scope:
        description: 'Compatibility input; a supplied ticker always runs stock research'
        type: string
        default: stock
      recover_daily:
        description: 'Explicitly send today’s saved report now, including after 11:00'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ticker:
        type: string
        default: ''
      recover_daily:
        type: boolean
        default: false

env:
  DAILY_ALLOW_LATE: 'true'

permissions:
  contents: read
  actions: read

concurrency:
  group: hk-daily-${{ inputs.ticker != '' && 'stock' || 'daily' }}
  cancel-in-progress: false

jobs:
  requested_stock:
    if: inputs.ticker != ''
    uses: ./.github/workflows/telegram-stock-request.yml
    with:
      ticker: ${{ inputs.ticker }}
    secrets: inherit

  # Every backup can start missing research; the shared group and daily claim
  # serialize recovery and prevent a fallback from overtaking active research.
  report:
    outputs:
      request_accepted: ${{ steps.morning.outputs.request_accepted }}
      repair: ${{ steps.morning.outputs.repair }}
    if: inputs.ticker == '' && !inputs.recover_daily
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
    steps:
      - name: Inspect today's saved research and budget
        id: morning
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
            core.setOutput('date', day);
            core.setOutput('request_accepted', 'true');
            const clock = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Hong_Kong', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(new Date());
            let repair = false;
            if (context.eventName === 'push') {
              const {data} = await github.rest.repos.getContent({...context.repo, path:'.github/daily-run-request.json', ref:context.sha});
              const request = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              repair = request.retry_incomplete === true;
              if (request.date !== day) {
                core.setOutput('request_accepted', 'false');
                core.setOutput('skip', 'true');
                core.info('Ignoring an expired daily recovery request.');
                return;
              }
            }
            core.setOutput('repair', repair ? 'true' : 'false');
            const researchClaim = 'hk-daily-research-claim-' + day + (repair ? '-repair-' + context.sha : '');
            core.setOutput('research_claim', researchClaim);
            const late = process.env.DAILY_ALLOW_LATE === 'true';
            if (clock < '10:00' || clock >= '23:45' || (!late && clock >= '10:50')) {
              core.setOutput('skip', 'true');
              core.info('Outside the authorized daily research start window; no research claim created.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            const current = artifacts.filter(a => !a.expired && a.name.startsWith('hk-morning-' + day + '-')).sort((a,b) => b.id-a.id);
            const claimed = artifacts.some(a => !a.expired && a.name === researchClaim);
            if (repair && !artifacts.some(a => !a.expired && a.name === 'hk-daily-delivery-receipt-' + day)) {
              core.setOutput('skip', 'true');
              core.setOutput('request_accepted', 'false');
              core.setFailed('A same-day confirmed receipt is required for repair and message update.');
              return;
            }
            core.setOutput('skip', (!repair && current.length) || claimed ? 'true' : 'false');
            const ledger = artifacts.filter(a => !a.expired && a.name.startsWith('hk-token-budget-' + day + '-')).sort((a,b) => b.id-a.id)[0];
            if (ledger) {
              core.setOutput('ledger_name', ledger.name);
              core.setOutput('ledger_run', String(ledger.workflow_run.id));
            }
      - uses: actions/checkout@v4
        if: steps.morning.outputs.skip != 'true'
        with:
          submodules: false
      - name: Initialize report dependencies only (FinRL trains separately)
        if: steps.morning.outputs.skip != 'true'
        run: git submodule update --init --recursive tradingagents tools/book-to-skill
      - name: Restore today's already charged API calls
        if: steps.morning.outputs.skip != 'true' && steps.morning.outputs.ledger_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.morning.outputs.ledger_name }}
          run-id: ${{ steps.morning.outputs.ledger_run }}
          github-token: ${{ github.token }}
          path: .
      - name: Reserve the day's only paid research session
        if: steps.morning.outputs.skip != 'true'
        run: echo '${{ github.run_id }}:${{ github.run_attempt }}' > research_claim.txt
      - name: Persist the research claim before any paid API calls
        if: steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.morning.outputs.research_claim }}
          path: research_claim.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        if: steps.morning.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: steps.morning.outputs.skip != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ./tradingagents
      - name: Locate independent Kronos forecast
        if: steps.morning.outputs.skip != 'true'
        id: kronos
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'kronos-research.yml', status:'success', per_page:5});
            for (const run of runs.data.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id:run.id});
              const artifact = data.artifacts.find(a => !a.expired && a.name.startsWith('kronos-forecast-'));
              if (artifact) { core.setOutput('name',artifact.name); core.setOutput('run',String(run.id)); break; }
            }
      - name: Read independent forecast without delaying research
        if: steps.morning.outputs.skip != 'true' && steps.kronos.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.kronos.outputs.name }}
          run-id: ${{ steps.kronos.outputs.run }}
          github-token: ${{ github.token }}
          path: .
      - name: Locate independent Fincept research
        if: steps.morning.outputs.skip != 'true'
        id: fincept
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'fincept-research.yml', status:'success', per_page:5});
            for (const run of runs.data.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id:run.id});
              const artifact = data.artifacts.find(a => !a.expired && a.name.startsWith('fincept-research-'));
              if (artifact) { core.setOutput('name',artifact.name); core.setOutput('run',String(run.id)); break; }
            }
      - name: Read Fincept artifact without loading its runtime
        if: steps.morning.outputs.skip != 'true' && steps.fincept.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.fincept.outputs.name }}
          run-id: ${{ steps.fincept.outputs.run }}
          github-token: ${{ github.token }}
          path: .
      - name: Run bounded daily research
        if: steps.morning.outputs.skip != 'true'
        env:
          TAHK_RESEARCH_INPUT_JSON: ${{ secrets.TAHK_RESEARCH_INPUT_JSON }}
          DAILY_RESEARCH_LIMIT: '1'
        run: python daily_runner.py
      - name: Prepare a safe concise fallback if research failed
        if: always() && steps.morning.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from daily_budget import Budget, HKT
          from daily_delivery import fallback_summary
          Budget(Path('daily_token_usage.json'), datetime.now(HKT).date().isoformat())
          if not Path('final_summary.txt').is_file():
              Path('final_summary.txt').write_text(fallback_summary())
          PY
      - name: Save the daily API ledger before other artifacts
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-token-budget-${{ steps.morning.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: daily_token_usage.json
          if-no-files-found: error
          retention-days: 30
      - name: Save one concise morning report
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-morning-${{ steps.morning.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final_summary.txt
            daily_research_status.txt
            daily_research_status.json
          if-no-files-found: error
          retention-days: 3
      - name: Save market research for the Mac option update
        if: success() && steps.morning.outputs.skip != 'true' && hashFiles('market_briefing.json', 'stock_signals.json') != '' && hashFiles('report_market.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hk-market-research-${{ steps.morning.outputs.date }}
          overwrite: true
          path: |
            market_briefing.json
            market_candidates.json
            report_market.md
            news_market.md
            stock_signals.json
            agent_events.jsonl
            stock_analysis.md
          retention-days: 3
      - name: Save research audit without sending another report
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report_*.md
            news_*.md
            free_news_*.json
            market_candidates.json
            opportunity_candidates.json
            overnight_call.json
            market_briefing.json
            stock_signals.json
            stock_analysis.md
            recommendations.*
            public_option_data.json
            kronos_forecast.json
            fincept_forecast.json
            trading_workflows.json
            trading_workflows.md
            final_summary.txt
            daily_token_usage.json
            daily_research_status.json
            run_*.log
          if-no-files-found: warn

  send_morning:
    needs: report
    if: always() && inputs.ticker == '' && needs.report.outputs.request_accepted != 'false'
    concurrency:
      group: hk-daily-telegram-delivery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DAILY_MANUAL_RECOVERY: ${{ inputs.recover_daily && 'true' || 'false' }}
      DAILY_REPAIR: ${{ needs.report.outputs.repair }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deadline, daily delivery claim and current report
        id: locate
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const day = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit'}).format(now);
            const clock = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Hong_Kong', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(now);
            const repair = process.env.DAILY_REPAIR === 'true';
            const claim = repair ? 'hk-daily-delivery-edit-claim-' + day + '-' + context.runId : 'hk-daily-delivery-claim-' + day;
            core.setOutput('receipt_name', repair ? 'hk-daily-delivery-update-receipt-' + day + '-' + context.runId : 'hk-daily-delivery-receipt-' + day);
            core.setOutput('date',day);
            core.setOutput('claim',claim);
            if (clock < '10:00') {
              core.setOutput('skip','true');
              core.info('Daily analysis starts at 10:00 HKT; no earlier report.');
              return;
            }
            if (!process.env.TELEGRAM_BOT_TOKEN?.trim() || !process.env.TELEGRAM_CHAT_ID?.trim()) {
              core.setOutput('skip','true');
              core.setFailed('Telegram delivery credentials are missing. No report sent.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            if (artifacts.some(a => a.name === claim && !a.expired)) {
              core.setOutput('skip','true');
              const confirmed = artifacts.some(a => !a.expired && a.name === 'hk-daily-delivery-receipt-' + day);
              if (!confirmed) core.setFailed('A previous send attempt has no confirmed receipt; inspect it before retrying.');
              return;
            }
            if (clock >= '10:59' && process.env.DAILY_MANUAL_RECOVERY !== 'true' && process.env.DAILY_ALLOW_LATE !== 'true') {
              core.setOutput('skip','true');
              core.setFailed('Missed 11:00 HKT delivery deadline. No Telegram report sent. Use recover_daily for an explicit catch-up.');
              return;
            }
            if (repair) {
              const receipt = artifacts.find(a => !a.expired && a.name === 'hk-daily-delivery-receipt-' + day);
              if (!receipt) {
                core.setOutput('skip','true');
                core.setFailed('Cannot update the earlier message without its confirmed receipt.');
                return;
              }
              core.setOutput('prior_receipt', receipt.name);
              core.setOutput('prior_run', String(receipt.workflow_run.id));
              core.setOutput('update_existing', 'true');
            }
            const report = artifacts.filter(a => !a.expired && a.name.startsWith('hk-morning-' + day + '-')).sort((a,b) => b.id-a.id)[0];
            // Let bounded late research finish and upload before claiming delivery.
            // The 10:53 slot sends the final fallback if no valid artifact arrives.
            if (!report && clock < '10:52' && process.env.DAILY_MANUAL_RECOVERY !== 'true') {
              core.setOutput('skip','true');
              core.info('Morning research not yet saved; defer delivery until a later backup slot.');
              return;
            }
            core.setOutput('skip','false');
            if (report) {
              core.setOutput('name', report.name);
              core.setOutput('run_id', String(report.workflow_run.id));
            }
      - name: Download today's concise report
        if: steps.locate.outputs.skip == 'false' && steps.locate.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: morning_report
      - name: Load confirmed receipt for the explicitly requested message update
        if: steps.locate.outputs.skip == 'false' && steps.locate.outputs.update_existing == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.locate.outputs.prior_receipt }}
          run-id: ${{ steps.locate.outputs.prior_run }}
          github-token: ${{ github.token }}
          path: prior_delivery
      - name: Prepare durable delivery claim
        if: steps.locate.outputs.skip == 'false'
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          from pathlib import Path
          from daily_delivery import HKT
          from daily_budget import RESEARCH_START, DELIVERY_LAST_START
          now = datetime.now(HKT)
          if now.time() < RESEARCH_START:
              raise SystemExit('No daily delivery before 10:00 HKT.')
          if os.getenv('DAILY_MANUAL_RECOVERY') != 'true' and os.getenv('DAILY_ALLOW_LATE') != 'true' and now.time() >= DELIVERY_LAST_START:
              raise SystemExit('Outside the daily delivery window.')
          Path('delivery_claim.txt').write_text(now.isoformat())
          PY
      - name: Claim the day's single send attempt before contacting Telegram
        if: steps.locate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.claim }}
          path: delivery_claim.txt
          if-no-files-found: error
          retention-days: 7
      - name: Send one current-day concise message
        if: steps.locate.outputs.skip == 'false'
        env:
          DAILY_DELIVERY_CLAIMED: 'true'
          DAILY_UPDATE_EXISTING: ${{ steps.locate.outputs.update_existing }}
        run: python daily_delivery.py
      - name: Save confirmed delivery receipt
        if: success() && steps.locate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.receipt_name }}
          path: delivery_receipt.json
          if-no-files-found: error
          retention-days: 30




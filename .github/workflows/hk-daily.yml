name: HK Daily Report

on:
  schedule:
    - cron: '17 20 * * *'  # 04:17 HKT: budgeted research; delayed-start grace through 07:15
    - cron: '47 22 * * *'  # 06:47 HKT: one concise message
    - cron: '17 23 * * *'  # 07:17 HKT: backup if delivery has not been claimed
    - cron: '37 23 * * *' # 07:37 HKT: backup if receipt missing
    - cron: '47 23 * * *' # 07:47 HKT: final chance, no duplicate sends
  workflow_dispatch:
    inputs:
      ticker:
        description: 'HK stock code (blank = daily research)'
        type: string
        default: ''
      request_source:
        description: 'Caller label; compatible with the existing Telegram bridge'
        type: string
        default: manual
      scope:
        description: 'Compatibility input; a supplied ticker always runs stock research'
        type: string
        default: stock
      recover_daily:
        description: 'Explicitly send today’s saved report now, including after 08:00'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ticker:
        type: string
        default: ''
      recover_daily:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: hk-daily-${{ inputs.ticker != '' && 'stock' || inputs.recover_daily && 'recovery' || github.event.schedule == '17 20 * * *' && 'research' || github.event_name == 'workflow_dispatch' && 'research' || 'delivery' }}
  cancel-in-progress: false

jobs:
  requested_stock:
    if: inputs.ticker != ''
    uses: ./.github/workflows/telegram-stock-request.yml
    with:
      ticker: ${{ inputs.ticker }}
    secrets: inherit

  report:
    if: inputs.ticker == '' && !inputs.recover_daily && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 20 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
    steps:
      - name: Inspect today's saved research and budget
        id: morning
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
            core.setOutput('date', day);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            const current = artifacts.filter(a => !a.expired && a.name.startsWith('hk-morning-' + day + '-')).sort((a,b) => b.id-a.id);
            const claimed = artifacts.some(a => !a.expired && a.name === 'hk-daily-research-claim-' + day);
            core.setOutput('skip', current.length || claimed ? 'true' : 'false');
            const ledger = artifacts.filter(a => !a.expired && a.name.startsWith('hk-token-budget-' + day + '-')).sort((a,b) => b.id-a.id)[0];
            if (ledger) {
              core.setOutput('ledger_name', ledger.name);
              core.setOutput('ledger_run', String(ledger.workflow_run.id));
            }
      - uses: actions/checkout@v4
        if: steps.morning.outputs.skip != 'true'
        with:
          submodules: false
      - name: Initialize report dependencies only (FinRL trains separately)
        if: steps.morning.outputs.skip != 'true'
        run: git submodule update --init --recursive tradingagents tools/book-to-skill
      - name: Restore today's already charged API calls
        if: steps.morning.outputs.skip != 'true' && steps.morning.outputs.ledger_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.morning.outputs.ledger_name }}
          run-id: ${{ steps.morning.outputs.ledger_run }}
          github-token: ${{ github.token }}
          path: .
      - name: Reserve the day's only paid research session
        if: steps.morning.outputs.skip != 'true'
        run: echo '${{ github.run_id }}:${{ github.run_attempt }}' > research_claim.txt
      - name: Persist the research claim before any paid API calls
        if: steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-daily-research-claim-${{ steps.morning.outputs.date }}
          path: research_claim.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        if: steps.morning.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: steps.morning.outputs.skip != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ./tradingagents
      - name: Locate independent Kronos forecast
        if: steps.morning.outputs.skip != 'true'
        id: kronos
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'kronos-research.yml', status:'success', per_page:5});
            for (const run of runs.data.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id:run.id});
              const artifact = data.artifacts.find(a => !a.expired && a.name.startsWith('kronos-forecast-'));
              if (artifact) { core.setOutput('name',artifact.name); core.setOutput('run',String(run.id)); break; }
            }
      - name: Read independent forecast without delaying research
        if: steps.morning.outputs.skip != 'true' && steps.kronos.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.kronos.outputs.name }}
          run-id: ${{ steps.kronos.outputs.run }}
          github-token: ${{ github.token }}
          path: .
      - name: Locate independent Fincept research
        if: steps.morning.outputs.skip != 'true'
        id: fincept
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'fincept-research.yml', status:'success', per_page:5});
            for (const run of runs.data.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id:run.id});
              const artifact = data.artifacts.find(a => !a.expired && a.name.startsWith('fincept-research-'));
              if (artifact) { core.setOutput('name',artifact.name); core.setOutput('run',String(run.id)); break; }
            }
      - name: Read Fincept artifact without loading its runtime
        if: steps.morning.outputs.skip != 'true' && steps.fincept.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.fincept.outputs.name }}
          run-id: ${{ steps.fincept.outputs.run }}
          github-token: ${{ github.token }}
          path: .
      - name: Run bounded daily research
        if: steps.morning.outputs.skip != 'true'
        env:
          TAHK_RESEARCH_INPUT_JSON: ${{ secrets.TAHK_RESEARCH_INPUT_JSON }}
        run: python daily_runner.py
      - name: Prepare a safe concise fallback if research failed
        if: always() && steps.morning.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from daily_budget import Budget, HKT
          from daily_delivery import fallback_summary
          Budget(Path('daily_token_usage.json'), datetime.now(HKT).date().isoformat())
          if not Path('final_summary.txt').is_file():
              Path('final_summary.txt').write_text(fallback_summary())
          PY
      - name: Save the daily API ledger before other artifacts
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-token-budget-${{ steps.morning.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: daily_token_usage.json
          if-no-files-found: error
          retention-days: 30
      - name: Save one concise morning report
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-morning-${{ steps.morning.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final_summary.txt
            daily_research_status.txt
          if-no-files-found: error
          retention-days: 3
      - name: Save market research for the Mac option update
        if: success() && steps.morning.outputs.skip != 'true' && hashFiles('market_briefing.json', 'stock_signals.json') != '' && hashFiles('report_market.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hk-market-research-${{ steps.morning.outputs.date }}
          overwrite: true
          path: |
            market_briefing.json
            market_candidates.json
            report_market.md
            news_market.md
            stock_signals.json
            stock_analysis.md
          retention-days: 3
      - name: Save research audit without sending another report
        if: always() && steps.morning.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report_*.md
            news_*.md
            free_news_*.json
            market_candidates.json
            market_briefing.json
            stock_signals.json
            stock_analysis.md
            recommendations.*
            kronos_forecast.json
            fincept_forecast.json
            trading_workflows.json
            trading_workflows.md
            final_summary.txt
            daily_token_usage.json
            run_*.log
          if-no-files-found: warn

  send_morning:
    needs: report
    if: always() && inputs.ticker == '' && (github.event_name == 'schedule' || inputs.recover_daily)
    concurrency:
      group: hk-daily-telegram-delivery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DAILY_MANUAL_RECOVERY: ${{ inputs.recover_daily && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deadline, daily delivery claim and current report
        id: locate
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const day = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit'}).format(now);
            const clock = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Hong_Kong', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(now);
            const claim = 'hk-daily-delivery-claim-' + day;
            core.setOutput('date',day);
            core.setOutput('claim',claim);
            if (!process.env.TELEGRAM_BOT_TOKEN?.trim() || !process.env.TELEGRAM_CHAT_ID?.trim()) {
              core.setOutput('skip','true');
              core.setFailed('Telegram delivery credentials are missing. No report sent.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            if (artifacts.some(a => a.name === claim && !a.expired)) {
              core.setOutput('skip','true');
              const confirmed = artifacts.some(a => !a.expired && a.name === 'hk-daily-delivery-receipt-' + day);
              if (!confirmed) core.setFailed('A previous send attempt has no confirmed receipt; inspect it before retrying.');
              return;
            }
            if (clock >= '07:59' && process.env.DAILY_MANUAL_RECOVERY !== 'true') {
              core.setOutput('skip','true');
              core.setFailed('Missed 08:00 HKT delivery deadline. No Telegram report sent. Use recover_daily for an explicit catch-up.');
              return;
            }
            const report = artifacts.filter(a => !a.expired && a.name.startsWith('hk-morning-' + day + '-')).sort((a,b) => b.id-a.id)[0];
            // Do not send a waiting-only fallback while delayed research may still
            // finish. Later 07:37/07:47 backups can safely send if no artifact arrives.
            if (!report && clock < '07:25' && process.env.DAILY_MANUAL_RECOVERY !== 'true') {
              core.setOutput('skip','true');
              core.info('Morning research not yet saved; defer delivery until a later backup slot.');
              return;
            }
            core.setOutput('skip','false');
            if (report) {
              core.setOutput('name', report.name);
              core.setOutput('run_id', String(report.workflow_run.id));
            }
      - name: Download today's concise report
        if: steps.locate.outputs.skip == 'false' && steps.locate.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: morning_report
      - name: Prepare durable delivery claim
        if: steps.locate.outputs.skip == 'false'
        run: |
          python - <<'PY'
          from datetime import datetime, time
          import os
          from pathlib import Path
          from daily_delivery import HKT
          now = datetime.now(HKT)
          if os.getenv('DAILY_MANUAL_RECOVERY') != 'true' and now.time() >= time(7, 59):
              raise SystemExit('Delivery deadline reached.')
          Path('delivery_claim.txt').write_text(now.isoformat())
          PY
      - name: Claim the day's single send attempt before contacting Telegram
        if: steps.locate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.claim }}
          path: delivery_claim.txt
          if-no-files-found: error
          retention-days: 7
      - name: Send one current-day concise message
        if: steps.locate.outputs.skip == 'false'
        env:
          DAILY_DELIVERY_CLAIMED: 'true'
        run: python daily_delivery.py
      - name: Save confirmed delivery receipt
        if: success() && steps.locate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: hk-daily-delivery-receipt-${{ steps.locate.outputs.date }}
          path: delivery_receipt.json
          if-no-files-found: error
          retention-days: 30



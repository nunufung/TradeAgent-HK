name: HK Daily Report
on:
  schedule:
    - cron: '0 23 * * *'  # 07:00 HKT -> 700,2800
    - cron: '0 2 * * *'   # 10:00 HKT
  workflow_dispatch:
    inputs:
      ticker:
        description: '輸入港股號碼，例如 700 / 2800 / 981 / 9988'
        required: false
        default: '700'
        type: string

concurrency:
  group: hk-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_BASE: https://api.deepseek.com/v1
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report (dynamic)
        run: |
          set -e
          TICKER="${{ inputs.ticker }}"
          # 如果係 schedule 自動跑，TICKER 會係空，就跑晒 700 同 2800
          if [ -z "$TICKER" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run -> 700 + 2800"
            python -u hk_adapter.py 700 | tee report_0700.md
            python -u hk_adapter.py 2800 | tee report_2800.md
          else
            echo "Manual run -> $TICKER"
            python -u hk_adapter.py $TICKER | tee report_${TICKER}.md
            cat report_${TICKER}.md
          fi

                - name: Send report to Telegram
        run: |
          python - <<'PY'
          import os
          import glob
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          files = sorted(glob.glob("report_*.md"))

          if not files:
              message = "TradeAgent-HK: No report was generated."
          else:
              parts = []
              for filename in files:
                  with open(filename, "r", encoding="utf-8") as f:
                      parts.append(f.read())

              report = "\n\n".join(parts)
              report = report[:3500]

              message = "📊 TradeAgent-HK Report\n\n" + report

          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=30
          )

          r.raise_for_status()
          print("Telegram report sent.")
          PY
          

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-reports
          path: report_*.md

name: HK Daily Report

on:
  schedule:
    - cron: '0 23 * * *'  # 07:00 HKT
    - cron: '0 2 * * *'   # 10:00 HKT
  workflow_dispatch:
    inputs:
      ticker:
        description: '輸入港股號碼，例如 700 / 2800 / 981 / 9988'
        required: false
        default: '700'
        type: string

concurrency:
  group: hk-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_BASE: https://api.deepseek.com/v1
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules : recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install TradeAgent-HK dependencies
          pip install -r requirements.txt

          # Install TauricResearch TradingAgents
          pip install ./tradingagents

      - name: Run report (dynamic)
        run: |
          set -e

          TICKER="${{ inputs.ticker }}"

          # Scheduled runs keep the existing behaviour:
          # run both 700 and 2800.
          #
          # Manual workflow runs use the ticker entered above.
          if [ -z "$TICKER" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run -> 700 + 2800"

            python -u hk_adapter.py 700 | tee report_0700.md
            python -u hk_adapter.py 2800 | tee report_2800.md
          else
            echo "Manual run -> $TICKER"

            python -u hk_adapter.py "$TICKER" | tee "report_${TICKER}.md"
            cat "report_${TICKER}.md"
          fi

      - name: Send report to Telegram
        if: success()

        # Telegram failure must NOT break your existing report workflow.
        continue-on-error: true

        run: |
          python - <<'PY'
          import glob
          import os
          import time
          import requests

          from datetime import datetime
          from zoneinfo import ZoneInfo


          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()


          # If Telegram is not configured yet,
          # keep the normal HK report workflow running.
          if not token or not chat_id:
              print(
                  "Telegram secrets are not configured. "
                  "Skipping Telegram delivery."
              )
              raise SystemExit(0)


          files = sorted(glob.glob("report_*.md"))

          if not files:
              print(
                  "No report files found. "
                  "Skipping Telegram delivery."
              )
              raise SystemExit(0)


          # Some existing report commands may create duplicate content
          # under different filenames.
          # Do not send the same report twice.
          reports = []
          seen = set()

          for filename in files:

              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8",
                  ) as f:
                      body = f.read().strip()

              except Exception as exc:
                  print(
                      f"Could not read {filename}: {exc}"
                  )
                  continue


              if not body:
                  continue

              if body in seen:
                  continue


              seen.add(body)

              reports.append(
                  (
                      filename,
                      body,
                  )
              )


          if not reports:
              print(
                  "No non-empty report content found. "
                  "Skipping Telegram delivery."
              )
              raise SystemExit(0)


          now_hkt = datetime.now(
              ZoneInfo("Asia/Hong_Kong")
          )

          header = (
              "📊 TradeAgent-HK | "
              f"{now_hkt:%Y-%m-%d %H:%M HKT}"
          )


          # Telegram has a message-size limit.
          # Split long TradingAgents reports safely
          # instead of cutting away the rest.
          def chunks(
              text,
              limit=3800,
          ):

              text = text.strip()

              while text:

                  if len(text) <= limit:
                      yield text
                      break


                  cut = text.rfind(
                      "\n",
                      0,
                      limit,
                  )


                  if cut < limit // 2:
                      cut = limit


                  yield text[:cut].strip()

                  text = text[cut:].strip()


          endpoint = (
              "https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )


          first_message = True


          for filename, body in reports:

              report_text = (
                  f"{filename}\n\n"
                  f"{body}"
              )


              for part in chunks(report_text):

                  if first_message:
                      message = (
                          f"{header}\n\n"
                          f"{part}"
                      )
                  else:
                      message = part


                  response = requests.post(
                      endpoint,
                      json={
                          "chat_id": chat_id,
                          "text": message,
                          "disable_web_page_preview": True,
                      },
                      timeout=30,
                  )


                  response.raise_for_status()


                  first_message = False

                  time.sleep(0.5)


          print(
              "Telegram report sent successfully."
          )

          PY

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()

        with:
          name: hk-reports
          path: |
  report_*.md
  pdf_reports/*.pdf
if-no-files-found: warn
       

name: HK Daily Report

on:
  schedule:
    - cron: '0 23 * * *'  # 07:00 HKT
    - cron: '0 2 * * *'   # 10:00 HKT

  workflow_dispatch:
    inputs:
      ticker:
        description: 'Hong Kong stock number, e.g. 700 / 2800 / 981 / 9988'
        required: true
        default: '700'
        type: string

      request_source:
        description: 'Request source'
        required: false
        default: 'github'
        type: string

concurrency:
  group: hk-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_BASE: https://api.deepseek.com/v1
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules : recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install TradeAgent-HK dependencies
          pip install -r requirements.txt

          # Install TauricResearch TradingAgents
          pip install ./tradingagents

      - name: Run report (dynamic)
        run: |
          set -e

          TICKER="${{ inputs.ticker }}"

          # Scheduled runs keep the existing behaviour:
          # run both 700 and 2800.
          #
          # Manual workflow runs use the ticker entered above.
          if [ -z "$TICKER" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run -> 700 + 2800"

            python -u hk_adapter.py 700 | tee report_0700.md
            python -u hk_adapter.py 2800 | tee report_2800.md
          else
            echo "Manual run -> $TICKER"

            python -u hk_adapter.py "$TICKER" | tee "report_${TICKER}.md"
            cat "report_${TICKER}.md"
          fi

      - name: Generate PDF report
        if: success()
        continue-on-error: true
        run: |
          mkdir -p pdf_reports
          python generate_pdf.py --output-dir pdf_reports
          echo "Generated PDF files:"
          ls -lh pdf_reports || true

      - name: Send report to Telegram
        if: success()
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob
          import os
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              print("Telegram secrets are not configured. Skipping Telegram.")
              raise SystemExit(0)

          now_hkt = datetime.now(ZoneInfo("Asia/Hong_Kong"))

          pdf_files = sorted(glob.glob("pdf_reports/*.pdf"))

          # Preferred: send the PDF report
          if pdf_files:
              for pdf_path in pdf_files:
                  caption = (
                      "📊 TradeAgent-HK Daily Report\n"
                      f"{now_hkt:%Y-%m-%d %H:%M HKT}\n\n"
                      "Full analysis attached as PDF."
                  )

                  with open(pdf_path, "rb") as pdf:
                      response = requests.post(
                          f"https://api.telegram.org/bot{token}/sendDocument",
                          data={
                              "chat_id": chat_id,
                              "caption": caption,
                          },
                          files={
                              "document": (
                                  os.path.basename(pdf_path),
                                  pdf,
                                  "application/pdf",
                              )
                          },
                          timeout=60,
                      )

                  response.raise_for_status()
                  print(f"Telegram PDF sent: {pdf_path}")

              raise SystemExit(0)

          # Fallback: if PDF generation failed, send the old text report
          print("No PDF found. Falling back to text report.")

          report_files = sorted(glob.glob("report_*.md"))

          if not report_files:
              print("No report files available.")
              raise SystemExit(0)

          parts = []

          for path in report_files:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read().strip()

              if text:
                  parts.append(text)

          if not parts:
              print("Report files were empty.")
              raise SystemExit(0)

          message = (
              "📊 TradeAgent-HK Report\n"
              f"{now_hkt:%Y-%m-%d %H:%M HKT}\n\n"
              + "\n\n".join(parts)
          )

          # Telegram text message safety limit
          message = message[:3800]

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": True,
              },
              timeout=30,
          )

          response.raise_for_status()
          print("Telegram text fallback sent.")
          PY

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-reports
          path: |
            report_*.md
            pdf_reports/*.pdf
          if-no-files-found: warn
       

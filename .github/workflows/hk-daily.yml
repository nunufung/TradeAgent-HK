name: HK Daily Report
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
concurrency:
  group: hk-daily
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_BASE: https://api.deepseek.com/v1
      PYTHONPATH: ${{ github.workspace }}/tradingagents:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          set -e
          python -u hk_adapter.py 700 | tee report_0700.md
          python -u hk_adapter.py 2800 | tee report_2800.md
          cat report_0700.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-reports
          path: report_*.md

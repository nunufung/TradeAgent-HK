name: Hugging Face Research Dashboard Sync

on:
  schedule:
    - cron: '25 0 * * *' # 08:25 HKT, after the 08:05 health audit
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'tests/test_public_dashboard.py'
      - '.github/workflows/hf-dashboard.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: hf-dashboard-sync
  cancel-in-progress: false

jobs:
  public-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test public-data privacy and contract
        run: python -m unittest discover -s tests -p test_public_dashboard.py -v
      - name: Syntax check browser interaction
        run: |
          node --check dashboard/space/assets/app.js
          node --check dashboard/space/assets/live-lookup.js
          node --test --test-timeout=5000 tests/test_dashboard_refresh.js tests/test_live_lookup.js
      - name: Test live lookup and private Futu bridge
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'itsdangerous>=2.2,<3' 'yfinance>=1.7,<2' 'pytest>=8,<10'
          python -m pytest tests/test_live_lookup.py tests/test_futu_connector.py tests/test_live_research.py -q
          python -m compileall -q dashboard/space scripts/futu_lookup_connector.py
          bash -n scripts/install-futu-connector.sh
      - name: Locate dated main-branch model and health artifacts
        id: sources
        uses: actions/github-script@v7
        with:
          script: |
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const eligible = all.filter(a => !a.expired && a.workflow_run?.head_branch === 'main')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            for (const [key,prefix] of Object.entries({
              health: 'production-health-',
              fincept: 'fincept-research-',
              kronos: 'kronos-forecast-',
              recommendations: 'hk-reports-'
            })) {
              const artifact = eligible.find(a => a.name.startsWith(prefix));
              if (artifact) {
                core.setOutput(key + '_name', artifact.name);
                core.setOutput(key + '_run', String(artifact.workflow_run.id));
              } else {
                core.warning(key + ' artifact missing; dashboard will mark data unavailable.');
              }
            }
      - name: Download verified health audit
        if: steps.sources.outputs.health_name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.health_name }}
          run-id: ${{ steps.sources.outputs.health_run }}
          github-token: ${{ github.token }}
          path: dashboard/import/health
      - name: Download Fincept forecast
        if: steps.sources.outputs.fincept_name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.fincept_name }}
          run-id: ${{ steps.sources.outputs.fincept_run }}
          github-token: ${{ github.token }}
          path: dashboard/import/fincept
      - name: Download Kronos forecast
        if: steps.sources.outputs.kronos_name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.kronos_name }}
          run-id: ${{ steps.sources.outputs.kronos_run }}
          github-token: ${{ github.token }}
          path: dashboard/import/kronos
      - name: Download daily research recommendations (private staging only)
        if: steps.sources.outputs.recommendations_name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.recommendations_name }}
          run-id: ${{ steps.sources.outputs.recommendations_run }}
          github-token: ${{ github.token }}
          path: dashboard/import/recommendations
      - name: Export public-only dashboard snapshot
        run: python dashboard/build_data.py
      - name: Save browsable static dashboard
        uses: actions/upload-artifact@v4
        with:
          name: hf-dashboard-preview-${{ github.run_id }}
          path: dashboard/space/
          retention-days: 14
          if-no-files-found: error
      - name: Check availability of Hugging Face publish credential
        id: hf_auth
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect previous Space build failure
        if: ${{ github.ref == 'refs/heads/main' && steps.hf_auth.outputs.available == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          token=os.environ['HF_TOKEN']
          base='https://huggingface.co/api/spaces/lewisf/tradeagent-hk-dashboard'
          headers={'Authorization':'Bearer '+token}
          try:
              with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=15) as response:
                  stage=json.load(response).get('runtime',{}).get('stage')
              print('Previous runtime stage:',stage)
              if stage=='BUILD_ERROR':
                  with urllib.request.urlopen(urllib.request.Request(base+'/logs/build',headers=headers),timeout=15) as response:
                      count=0
                      for line in response:
                          value=line.decode(errors='replace').replace(token,'[REDACTED]')
                          if any(word in value.lower() for word in ['error','failed','no matching','conflict','resolutionimpossible','requires-python']):
                              print(value[:2000].strip())
                          count+=1
                          if count>=6000: break
          except Exception as exc:
              print('Build diagnostics unavailable:',type(exc).__name__)
          PY
      - name: Publish dashboard and live lookup to Hugging Face
        if: ${{ github.ref == 'refs/heads/main' && steps.hf_auth.outputs.available == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m pip install "huggingface_hub>=0.34,<2"
          python dashboard/publish_space.py
      - name: Explain missing write permission without claiming publication
        if: ${{ github.ref == 'refs/heads/main' && steps.hf_auth.outputs.available != 'true' }}
        run: |
          echo '### Space publish: NOT CONNECTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'The public dashboard was built and stored as a GitHub Actions artifact, but Hugging Face write access is missing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Add a write-scoped Hugging Face User Access Token named HF_TOKEN in GitHub repository Settings > Secrets and variables > Actions. Then re-run this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Space was created or updated in this run.' >> "$GITHUB_STEP_SUMMARY"
